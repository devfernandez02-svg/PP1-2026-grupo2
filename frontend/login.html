<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aromas Ligth - Iniciar Sesión</title>
    <link rel="stylesheet" href="style-login.css">
</head>
<body>

    <main>
        <div class="panel">

            <!-- LOGO -->
            <div class="logo-wrapper">
                <img src="/frontend/media/logo.jpeg" alt="Aromas Ligth Viandas" class="logo">
            </div>

            <!-- FORMULARIO -->
            <form class="formulario" action="#" method="post">

                <!-- Email -->
                <div class="grupo-campo">
                    <label for="usuario-email">Email</label>
                    <input type="email" id="usuario-email" name="email" required placeholder="Introduce el email">
                </div>

                <!-- Contraseña -->
                <div class="grupo-campo">
                    <div class="label-row">
                        <label for="usuario-password">Contraseña</label>
                        <a href="recuperar.html" class="recuperar">Recuperar contraseña</a>
                    </div>
                    <input type="password" id="usuario-password" name="password" required placeholder="Introduce la contraseña">
                </div>

                <!-- Botones principales -->
                <button type="submit" class="btn-iniciar">Iniciar Sesión</button>
                <button type="button" class="btn-registrar">Registrarse</button>

               

            </form>
        </div>
    </main>

</body>
</html>
